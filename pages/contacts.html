    <main>
        <main>
            <!-- Секция контактов -->
            <section class="py-5">
                <div class="container">
                    <div class="row">
                        <!-- Левая колонка - Форма -->
                        <div class="col-lg-8 mb-5">
                            <div class="card shadow-sm">
                                <div class="card-header bg-white">
                                    <h2 class="h4 mb-0">Свяжитесь со мной</h2>
                                </div>
                                <div class="card-body">
                                    <form>
                                        <!-- Поле Имя -->
                                        <div class="mb-3">
                                            <label for="name" class="form-label">Имя</label>
                                            <input type="text" class="form-control" id="name"
                                                placeholder="Введите ваше имя">
                                        </div>

                                        <!-- Поле Email -->
                                        <div class="mb-3">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="email" class="form-control" id="email"
                                                placeholder="Введите ваш email">
                                        </div>

                                        <!-- Поле Сообщение -->
                                        <div class="mb-4">
                                            <label for="message" class="form-label">Сообщение</label>
                                            <textarea class="form-control" id="message" rows="5"
                                                placeholder="Введите ваше сообщение..."></textarea>
                                        </div>

                                        <!-- Кнопка отправки -->
                                        <button type="submit" class="btn btn-primary btn-lg w-100">
                                            Отправить сообщение
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <!-- Правая колонка - Контактная информация -->
                        <div class="col-lg-4">
                            <div class="card shadow-sm">
                                <div class="card-header bg-white">
                                    <h2 class="h4 mb-0">Контакты</h2>
                                </div>

                                    <div class="mb-4">
                                        <h5 class="text-muted mb-3">Свяжитесь со мной:</h5>
                                        <ul class="list-unstyled">
                                            <li class="mb-3">
                                                <div class="d-flex align-items-center">
                                                    <span class="badge bg-primary me-3">@</span>
                                                    <span>abalyaev.n.d@edu.mirea.ru</span>
                                                </div>
                                            </li>
                                            <li class="mb-3">
                                                <div class="d-flex align-items-center">
                                                    <span class="badge bg-dark me-3">Git</span>
                                                    <span>nkt2006</span>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="d-flex align-items-center">
                                                    <span class="badge bg-success me-3">📍</span>
                                                    <span>Москва, Россия</span>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
